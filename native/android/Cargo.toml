[package]
name = "kiosk-android"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
kiosk_core = { path = "../core", package = "core" }
jni = "0.21"
tokio = { version = "1.53.1", features = ["rt", "macros", "fs"] }
async-trait = "0.1.92"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
android_logger = "0.15.1"
